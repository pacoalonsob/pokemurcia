<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carpeta Pocket</title>
<style>
:root{
  --bg:#F2F5FB;
  --surface:#FFFFFF;
  --surface-2:#E7EDF8;
  --ink:#20232B;
  --ink-soft:#5C6472;
  --accent:#2A75BB;
  --accent-ink:#FFFFFF;
  --gold:#FFCB05;
  --gold-ink:#3B2E00;
  --line:#D7E0F0;
  --danger:#EE1515;
  --danger-bg:#FCE4E2;
  --warn:#F2A73B;
  --warn-bg:#FBEBD3;
  --good-bg:#E3EEF9;
  --shadow:0 1px 2px rgba(32,35,43,.06),0 6px 16px rgba(32,35,43,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161C;
    --surface:#1B1E27;
    --surface-2:#242836;
    --ink:#ECEEF3;
    --ink-soft:#A7AFC0;
    --accent:#5B9BD9;
    --accent-ink:#0B1520;
    --gold:#FFD84D;
    --gold-ink:#2B2100;
    --line:#323647;
    --danger:#FF6B5B;
    --danger-bg:#3A211E;
    --warn:#FFC24D;
    --warn-bg:#3A3221;
    --good-bg:#1C2C3D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#14161C;
  --surface:#1B1E27;
  --surface-2:#242836;
  --ink:#ECEEF3;
  --ink-soft:#A7AFC0;
  --accent:#5B9BD9;
  --accent-ink:#0B1520;
  --gold:#FFD84D;
  --gold-ink:#2B2100;
  --line:#323647;
  --danger:#FF6B5B;
  --danger-bg:#3A211E;
  --warn:#FFC24D;
  --warn-bg:#3A3221;
  --good-bg:#1C2C3D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Work Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:"Kanit",system-ui,sans-serif;
  text-wrap:balance;
  letter-spacing:.01em;
}
.mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric: tabular-nums; }
a{color:inherit;}
button{font-family:inherit;}

.wrap{ max-width:960px; margin:0 auto; padding:18px 16px 64px; }

/* ---------- Header ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin-bottom:16px;
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  width:38px;height:38px;border-radius:50%;
  background:var(--surface); border:3px solid var(--ink);
  position:relative; overflow:hidden; flex:none; box-shadow:var(--shadow);
}
.brand-mark:before{ content:""; position:absolute; inset:0 0 50%; background:var(--danger); }
.brand-mark:after{ content:""; position:absolute; left:50%; top:50%; width:12px; height:12px; border-radius:50%;
  background:var(--surface); border:3px solid var(--ink); transform:translate(-50%,-50%); }
.brand h1{ font-size:1.3rem; margin:0; font-weight:700; }
.brand p{ margin:0; font-size:.78rem; color:var(--ink-soft); }

.ask-btn{
  display:flex; align-items:center; gap:6px;
  background:var(--accent); color:var(--accent-ink); border:none;
  padding:10px 14px; border-radius:999px; font-weight:600; font-size:.85rem;
  cursor:pointer; box-shadow:var(--shadow); white-space:nowrap;
}
.ask-btn:hover{ filter:brightness(1.05); }
.ask-btn .count{
  background:rgba(0,0,0,.18); border-radius:999px; padding:1px 8px; font-family:"IBM Plex Mono",monospace;
}

/* ---------- Players bar ---------- */
.players{
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px;
}
.player-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:10px 12px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:6px; min-width:0;
}
.player-top{ display:flex; align-items:center; gap:8px; min-width:0; }
.player-dot{ width:10px;height:10px;border-radius:50%; flex:none; }
.player-name{
  border:none; background:transparent; color:var(--ink); font-weight:600; font-size:.88rem;
  padding:2px 4px; border-radius:6px; min-width:0; flex:1;
  text-overflow:ellipsis; white-space:nowrap; overflow:hidden;
}
.player-name:hover,.player-name:focus{ background:var(--surface-2); outline:none; }

/* ---------- Tabs ---------- */
.tabs{ display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px; }
.tab{
  border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
  padding:9px 14px; border-radius:999px; font-size:.82rem; font-weight:600; white-space:nowrap;
  cursor:pointer; flex:none;
}
.tab[aria-selected="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.tab .n{ font-family:"IBM Plex Mono",monospace; opacity:.7; margin-left:4px; }

/* ---------- Controls ---------- */
.controls{
  display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;
}
.search{
  flex:1 1 180px; min-width:140px;
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:9px 12px; color:var(--ink); font-size:.85rem;
}
.search:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
select.rarity{
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:9px 10px; color:var(--ink); font-size:.82rem; max-width:100%;
}
.toggle{
  display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--ink-soft);
  background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 10px; cursor:pointer;
  user-select:none;
}
.toggle input{ accent-color:var(--accent); width:15px;height:15px; }

.markall-group{ display:flex; gap:6px; align-items:center; }
.markall-btn{
  width:32px; height:32px; border-radius:10px; border:1px solid var(--line); color:#fff;
  font-size:.68rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow); position:relative;
}
.markall-btn:after{ content:"✓"; position:absolute; bottom:-4px; right:-4px; background:var(--ink); color:var(--bg);
  border-radius:50%; width:14px; height:14px; font-size:.55rem; display:flex; align-items:center; justify-content:center; }
.markall-btn:hover{ filter:brightness(1.08); }

.set-meta{ font-size:.78rem; color:var(--ink-soft); margin:-4px 0 12px; }
.set-meta b{ color:var(--ink); font-weight:600; }

/* ---------- Card list ---------- */
.grid-head{
  display:grid; grid-template-columns:1fr repeat(3,52px);
  padding:0 10px 6px; font-size:.68rem;
  color:var(--ink-soft); font-weight:600;
}
.grid-head span{ display:flex; justify-content:center; }
.grid-head span:first-child{ justify-content:flex-start; }
.head-dot{
  display:inline-flex; align-items:center; justify-content:center;
  width:20px; height:20px; border-radius:50%; color:#fff; font-size:.6rem; font-weight:700;
  letter-spacing:0;
}

.rows{ display:flex; flex-direction:column; gap:5px; }
.row{
  display:grid; grid-template-columns:1fr repeat(3,52px); align-items:center;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:9px 10px; box-shadow:var(--shadow);
}
.row.all-have{ opacity:.62; }
.row.none-have{ border-color:var(--danger); background:var(--danger-bg); }
.card-id{ font-family:"IBM Plex Mono",monospace; font-size:.7rem; color:var(--ink-soft); margin-right:8px; }
.card-name{ font-size:.86rem; font-weight:500; }
.card-name b.hit{ background:rgba(255,203,5,.45); border-radius:3px; }
.tag{
  display:inline-block; font-size:.63rem; font-weight:700; padding:1px 6px; border-radius:5px;
  margin-left:6px; vertical-align:middle; white-space:nowrap;
}
.tag.t-ex{ background:var(--gold); color:var(--gold-ink); }
.tag.t-ar{ background:var(--good-bg); color:var(--accent); }
.tag.t-sr{ background:var(--warn-bg); color:var(--warn); }
.tag.t-sar{ background:linear-gradient(90deg,#FDE6E4,#FBEBD3,#E3EEF9); color:var(--ink); }
.tag.t-im{ background:var(--ink); color:var(--bg); }
.tag.t-sh{ background:var(--surface-2); color:var(--ink-soft); }
.tag.t-shsr{ background:var(--surface-2); color:var(--accent); }
.tag.t-cr{ background:var(--gold); color:var(--gold-ink); }
.namewrap{ display:flex; align-items:center; flex-wrap:wrap; gap:2px; min-width:0; }

.chk{ display:flex; justify-content:center; }
.chk button{
  width:28px;height:28px; border-radius:8px; border:2px solid var(--line); background:transparent;
  cursor:pointer; display:flex; align-items:center; justify-content:center; color:transparent;
  font-size:.9rem; font-weight:700; transition:.12s;
}
.chk button.have{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.chk button.want{ border-color:var(--danger); color:var(--danger); }
.chk button.some{ border-color:var(--warn); color:var(--warn); }
.chk button:not(.have):before{ content:"–"; opacity:.35; }
.chk button.have:before{ content:"✓"; }
.chk button.want:before{ content:"!"; }
.chk button.some:before{ content:"·"; }

.empty-state{
  text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:.9rem;
}

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(15,16,22,.5); display:flex; align-items:flex-end;
  justify-content:center; z-index:50; padding:0;
}
.overlay[hidden]{ display:none; }
.sheet{
  background:var(--surface); width:100%; max-width:640px; max-height:88vh; overflow-y:auto;
  border-radius:20px 20px 0 0; padding:20px 18px 28px; box-shadow:var(--shadow);
}
@media (min-width:640px){
  .overlay{ align-items:center; padding:20px; }
  .sheet{ border-radius:20px; max-height:80vh; }
}
.sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; gap:10px;}
.sheet-head h2{ margin:0; font-size:1.15rem; }
.close-btn{
  background:var(--surface-2); border:none; width:32px;height:32px;border-radius:50%;
  font-size:1rem; cursor:pointer; color:var(--ink); flex:none;
}
.sheet p.sub{ color:var(--ink-soft); font-size:.82rem; margin:2px 0 16px; }
.ask-group{ margin-bottom:18px; }
.ask-group h3{ font-size:.85rem; margin:0 0 8px; display:flex; align-items:center; gap:8px; }
.ask-group h3 .n{ font-family:"IBM Plex Mono",monospace; color:var(--ink-soft); font-weight:400; }
.ask-list{ background:var(--surface-2); border-radius:10px; padding:10px 12px; font-size:.82rem; line-height:1.7; max-height:220px; overflow-y:auto; }
.ask-list .none{ color:var(--ink-soft); font-style:italic; }
.copy-btn{
  margin-top:8px; display:inline-flex; align-items:center; gap:6px;
  background:var(--ink); color:var(--bg); border:none; padding:8px 14px; border-radius:999px;
  font-size:.78rem; font-weight:600; cursor:pointer;
}
.copy-btn.secondary{ background:transparent; color:var(--ink); border:1px solid var(--line); }
.copy-all{ position:sticky; bottom:-28px; background:var(--surface); padding:12px 0 0; margin-top:6px; }

.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:.85rem;
  opacity:0; pointer-events:none; transition:.2s; z-index:80; box-shadow:var(--shadow);
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.sync-note{
  font-size:.72rem; color:var(--warn); background:var(--warn-bg); border-radius:8px; padding:6px 10px; margin-bottom:12px;
  display:none;
}
.sync-note.show{ display:block; }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
</style>
</head>

    <div class="brand">
      <div class="brand-mark"></div>

</div>

<div class="overlay" id="askOverlay" hidden>
  <div class="sheet">

  </div>
</div>

<div class="toast" id="toast"></div>

let lastMarkAll = null; // {p, setId, keys} — the most recent "completar" batch, so the same button can undo it

function cardKey(setId, n){ return setId + "-" + n; }

function ownerCountForKey(key){
  let c = 0;
  for(let p=0;p<NUM_PLAYERS;p++) if(state.owned[p][key]) c++;
  return c;
}

function initials(name){
  const trimmed = (name||"").trim();
  if(!trimmed) return "?";
  return trimmed[0].toUpperCase();
}

// ---------- Rendering ----------
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function highlight(name, term){
  if(!term) return escapeHtml(name);
  const idx = name.toLowerCase().indexOf(term.toLowerCase());
  if(idx === -1) return escapeHtml(name);
  return escapeHtml(name.slice(0,idx)) + "<b class='hit'>" + escapeHtml(name.slice(idx, idx+term.length)) + "</b>" + escapeHtml(name.slice(idx+term.length));
}

function renderPlayers(){
  const el = document.getElementById("players");
  el.innerHTML = "";
  for(let p=0;p<NUM_PLAYERS;p++){
    const div = document.createElement("div");
    div.className = "player-card";
    div.innerHTML = `
      <div class="player-top">
        <span class="player-dot" style="background:${PLAYER_DOTS[p]}"></span>
        <input class="player-name" data-p="${p}" value="${escapeHtml(state.players[p])}" maxlength="18">
      </div>
    `;
    el.appendChild(div);
  }
  el.querySelectorAll(".player-name").forEach(inp => {
    inp.addEventListener("input", e => {
      const p = +e.target.dataset.p;
      state.players[p] = e.target.value;
      updateHeadDots();
    });
    inp.addEventListener("change", e => {
      const p = +e.target.dataset.p;
      const val = e.target.value.trim() || DEFAULT_NAMES[p];
      state.players[p] = val;
      if(e.target.value !== val) e.target.value = val;
      setPlayerName(p, val);
    });
  });
  updateHeadDots();
}

function updateHeadDots(){
  for(let p=0;p<NUM_PLAYERS;p++){
    const name = state.players[p] || DEFAULT_NAMES[p];
    const h = document.getElementById("h"+p);
    if(h) h.innerHTML = `<span class="head-dot" style="background:${PLAYER_DOTS[p]}" title="${escapeHtml(name)}">${escapeHtml(initials(name))}</span>`;
    const mb = document.querySelector(`.markall-btn[data-p="${p}"]`);
    if(mb){
      mb.style.background = PLAYER_DOTS[p];
      mb.textContent = initials(name);
      mb.title = `Marcar todas como "tengo" (${name}) en esta pestaña`;
    }
  }
}

function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  SETS.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "tab";
    btn.type = "button";
    btn.role = "tab";
    btn.setAttribute("aria-selected", s.id === state.activeSet ? "true":"false");
    btn.innerHTML = `${escapeHtml(s.short)} <span class="n">${s.normalCount} (${s.totalCount})</span>`;
    btn.addEventListener("click", () => { state.activeSet = s.id; renderTabs(); renderRows(); renderMeta(); });
    el.appendChild(btn);
  });
}

function renderMeta(){
  const s = SETS.find(x => x.id === state.activeSet);
  const el = document.getElementById("setMeta");
  const d = new Date(s.release + "T00:00:00");
  const dateStr = d.toLocaleDateString("es-ES", {day:"numeric", month:"long", year:"numeric"});
  el.innerHTML = escapeHtml(s.name) + " · salió el " + dateStr + " · <b>" + s.normalCount + "</b> normales para completarla (" + s.totalCount + " cartas en total con extras)";
}

function matchesFilters(s, c){
  if(state.search){
    if(!c.name.toLowerCase().includes(state.search.toLowerCase())) return false;
  }
  const info = RARITY_INFO[c.r];
  if(state.rarity === "ex" && c.r !== "DR") return false;
  else if(state.rarity !== "all" && state.rarity !== "ex" && info.group !== state.rarity) return false;
  if(state.onlyIncomplete && ownerCountForKey(cardKey(s.id, c.n)) === NUM_PLAYERS) return false;
  return true;
}

function renderRows(){
  const s = SETS.find(x => x.id === state.activeSet);
  const rowsEl = document.getElementById("rows");
  const empty = document.getElementById("emptyState");
  rowsEl.innerHTML = "";
  let shown = 0;
  const frag = document.createDocumentFragment();
  s.cards.forEach(c => {
    if(!matchesFilters(s,c)) return;
    shown++;
    const key = cardKey(s.id, c.n);
    const cnt = ownerCountForKey(key);
    const info = RARITY_INFO[c.r];
    const row = document.createElement("div");
    row.className = "row" + (cnt===NUM_PLAYERS ? " all-have" : "") + (cnt===0 ? " none-have" : "");
    let tags = "";
    if(info.tag) tags += `<span class="tag ${info.tag.cls}">${info.tag.text}</span>`;
    let chkHtml = "";
    for(let p=0;p<NUM_PLAYERS;p++){
      const has = !!state.owned[p][key];
      const otherHas = !has && cnt > 0;
      const cls = has ? "have" : (otherHas ? "some" : "want");
      chkHtml += `<div class="chk"><button type="button" class="${cls}" data-key="${key}" data-p="${p}" aria-label="${escapeHtml(state.players[p])}: ${has?'la tiene':'no la tiene'}"></button></div>`;
    }
    row.innerHTML = `
      <div class="namewrap"><span class="card-id">${String(c.n).padStart(3,"0")}</span><span class="card-name">${highlight(c.name, state.search)}</span>${tags}</div>
      ${chkHtml}
    `;
    frag.appendChild(row);
  });
  rowsEl.appendChild(frag);
  empty.hidden = shown > 0;
  rowsEl.querySelectorAll("button[data-key]").forEach(btn => {
    btn.addEventListener("click", () => toggleOwned(+btn.dataset.p, btn.dataset.key));
  });
}

function renderRarityOptions(){
  const el = document.getElementById("rarity");
  el.innerHTML = RARITY_FILTERS.map(f => `<option value="${f.value}">${escapeHtml(f.label)}</option>`).join("");
  el.value = state.rarity;
}

function renderAskCount(){
  let n = 0;
  SETS.forEach(s => s.cards.forEach(c => {
    if(RARITY_INFO[c.r].group !== "normal") return;
    if(ownerCountForKey(cardKey(s.id,c.n)) === 0) n++;
  }));
  document.getElementById("askCount").textContent = n;
}

function renderAll(){
  renderPlayers();
  renderTabs();
  renderMeta();
  renderRows();
  renderAskCount();
}

// Used after a checkbox toggle (locally or from another viewer via db).
// Tab labels and set info are static composition numbers, so they don't
// need to move — and crucially, this never rebuilds the name inputs.
function refreshAfterToggle(){
  renderRows();
  renderAskCount();
}

// Marks every card currently visible (respecting the active tab, rarity
// filter, search and "solo faltantes" toggle) as "have" for one player —
// handy near the end of a collection, when it's easier to start from
// "tengo todas" and uncheck the few missing ones than the other way round.
async function persistOwnedPatch(p, keys, value){
  if(!db) return;
  try{
    const ref = col().doc("progress_p"+p);
    const snap = await ref.get();
    const patch = {};
    keys.forEach(k => { patch["owned."+k] = value; });
    if(snap.exists) await ref.update(patch);
    else{
      const owned = {};
      keys.forEach(k => { owned[k] = value; });
      await ref.set({owned});
    }
  }catch(e){ /* best effort, local state already updated */ }
}

function markAllVisible(p){
  const s = SETS.find(x => x.id === state.activeSet);
  const visible = s.cards.filter(c => matchesFilters(s, c));
  const name = state.players[p] || DEFAULT_NAMES[p];

  // Pulsar el mismo botón justo después deshace exactamente lo que acaba de
  // marcar (no toca cartas que ya estuvieran marcadas antes de esa acción).
  if(lastMarkAll && lastMarkAll.p === p && lastMarkAll.setId === s.id &&
     lastMarkAll.keys.length > 0 && lastMarkAll.keys.every(k => state.owned[p][k])){
    const keys = lastMarkAll.keys;
    keys.forEach(k => { state.owned[p][k] = false; });
    lastMarkAll = null;
    refreshAfterToggle();
    showToast(`Deshecho: ${keys.length} cartas de ${name} vuelven a estar sin marcar`);
    persistOwnedPatch(p, keys, false);
    return;
  }

  const toMark = visible.filter(c => !state.owned[p][cardKey(s.id, c.n)]);
  if(toMark.length === 0){ showToast(`${name} ya las tiene todas marcadas aquí`); lastMarkAll = null; return; }

  const keys = toMark.map(c => cardKey(s.id, c.n));
  keys.forEach(k => { state.owned[p][k] = true; });
  lastMarkAll = { p, setId: s.id, keys };
  refreshAfterToggle();
  showToast(`Marcadas ${keys.length} cartas de ${name} — pulsa otra vez para deshacer`);
  persistOwnedPatch(p, keys, true);
}

// ---------- Ask sheet (only counts the "normal" cards needed to complete the collection) ----------
function buildAskText(){
  let lines = [];
  lines.push("📋 CARTAS QUE NOS FALTAN — Carpeta Pocket");
  lines.push("(solo cartas normales, las que hacen falta para completar la colección)");
  lines.push("");
  SETS.forEach(s => {
    const normalCards = s.cards.filter(c => RARITY_INFO[c.r].group === "normal");
    const missing = normalCards.filter(c => ownerCountForKey(cardKey(s.id,c.n)) === 0);
    lines.push(`🗂️ ${s.name} (nadie la tiene: ${missing.length})`);
    if(missing.length === 0){
      lines.push("  — ¡completa entre los 3! 🎉");
    } else {
      missing.forEach(c => lines.push(`  · ${String(c.n).padStart(3,"0")} ${c.name}${c.r==="DR"?" (ex)":""}`));
    }
    lines.push("");
  });
  lines.push("— — —");
  for(let p=0;p<NUM_PLAYERS;p++){
    let mine = [];
    SETS.forEach(s => s.cards.forEach(c => {
      if(RARITY_INFO[c.r].group !== "normal") return;
      const key = cardKey(s.id,c.n);
      if(!state.owned[p][key] && ownerCountForKey(key) > 0) mine.push(s.short+" · "+String(c.n).padStart(3,"0")+" "+c.name);
    }));
    lines.push(`🙋 A ${state.players[p]} le faltan (y algún compañero la tiene): ${mine.length}`);
    mine.slice(0,200).forEach(m => lines.push("  · " + m));
    lines.push("");
  }
  return lines.join("\n");
}

function renderAskSheet(){
  const body = document.getElementById("askBody");
  body.innerHTML = "";

  const noOneGroup = document.createElement("div");
  noOneGroup.className = "ask-group";
  const totalMissing = SETS.reduce((a,s)=>a+s.cards.filter(c=>RARITY_INFO[c.r].group==="normal" && ownerCountForKey(cardKey(s.id,c.n))===0).length,0);
  let noOneHtml = `<h3>❗ Nadie del grupo las tiene <span class="n">(${totalMissing})</span></h3>`;
  SETS.forEach(s => {
    const missing = s.cards.filter(c => RARITY_INFO[c.r].group === "normal" && ownerCountForKey(cardKey(s.id,c.n)) === 0);
    noOneHtml += `<p style="margin:10px 0 4px;font-weight:600;font-size:.8rem;color:var(--ink-soft)">${escapeHtml(s.short)}</p>`;
    noOneHtml += `<div class="ask-list">`;
    if(missing.length === 0) noOneHtml += `<span class="none">Completa entre los 3 🎉</span>`;
    else noOneHtml += missing.map(c => `${String(c.n).padStart(3,"0")} ${escapeHtml(c.name)}${c.r==="DR"?" <i>(ex)</i>":""}`).join("<br>");
    noOneHtml += `</div>`;
  });
  noOneGroup.innerHTML = noOneHtml;
  body.appendChild(noOneGroup);

  for(let p=0;p<NUM_PLAYERS;p++){
    let mine = [];
    SETS.forEach(s => s.cards.forEach(c => {
      if(RARITY_INFO[c.r].group !== "normal") return;
      const key = cardKey(s.id,c.n);
      if(!state.owned[p][key] && ownerCountForKey(key) > 0) mine.push(String(c.n).padStart(3,"0")+" "+c.name+" <span style='color:var(--ink-soft);font-size:.72rem'>· la tiene alguien del grupo</span>");
    }));
    const g = document.createElement("div");
    g.className = "ask-group";
    g.innerHTML = `<h3>🙋 A ${escapeHtml(state.players[p])} le faltan <span class="n">(${mine.length})</span></h3>
      <div class="ask-list">${mine.length ? mine.join("<br>") : "<span class='none'>Nada pendiente por aquí 🎉</span>"}</div>`;
    body.appendChild(g);
  }
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 1800);
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    showToast("Copiado ✅ pégalo en el grupo");
  }catch(e){
    showToast("No se pudo copiar automáticamente");
  }
}

// ---------- Firestore wiring ----------
// One shared, public collection ("carpetaPocket") — anyone with this file
// can read/write it, matching the Firestore rules set up for the group.
// No login of any kind, on any side, is involved.
function col(){ return db.collection("carpetaPocket"); }

async function setPlayerName(idx, name){
  // State and the input's own DOM value are already correct (set by the
  // change handler) — this only persists it, no re-render needed.
  if(!db) return;
  try{
    const ref = col().doc("players");
    const snap = await ref.get();
    const patch = {["name"+idx]: name};
    if(snap.exists) await ref.update(patch); else await ref.set(patch);
  }catch(e){ /* best effort */ }
}

async function toggleOwned(p, key){
  const cur = !!state.owned[p][key];
  state.owned[p][key] = !cur;
  refreshAfterToggle();
  if(!db) return;
  try{
    const ref = col().doc("progress_p"+p);
    const snap = await ref.get();
    // Firestore's update() replaces a nested object field wholesale, so a
    // dot-path key ("owned.<cardKey>") is required for a true partial merge
    // that doesn't wipe out every other card's checkmark.
    if(snap.exists) await ref.update({["owned."+key]: !cur});
    else await ref.set({owned:{[key]: !cur}});
  }catch(e){ /* best effort, local state already updated */ }
}

async function initDb(){
  try{
    if(typeof firebase === "undefined") throw new Error("Firebase SDK not loaded");
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  }catch(e){ db = null; }
  if(!db){
    document.getElementById("syncNote").classList.add("show");
    return;
  }
  col().doc("players").onSnapshot(snap => {
    if(snap.exists){
      const d = snap.data();
      for(let p=0;p<NUM_PLAYERS;p++){
        if(d["name"+p]) state.players[p] = d["name"+p];
      }
      renderAll();
    }
    document.getElementById("syncNote").classList.remove("show");
  }, () => { document.getElementById("syncNote").classList.add("show"); });

  for(let p=0;p<NUM_PLAYERS;p++){
    col().doc("progress_p"+p).onSnapshot(snap => {
      if(snap.exists){
        const d = snap.data();
        state.owned[p] = (d.owned && typeof d.owned === "object") ? d.owned : {};
        refreshAfterToggle();
      }
      document.getElementById("syncNote").classList.remove("show");
    }, () => { document.getElementById("syncNote").classList.add("show"); });
  }
}

// ---------- Init ----------
renderRarityOptions();
document.getElementById("search").addEventListener("input", e => { state.search = e.target.value; renderRows(); });
document.getElementById("rarity").addEventListener("change", e => { state.rarity = e.target.value; renderRows(); });
document.getElementById("onlyIncomplete").addEventListener("change", e => { state.onlyIncomplete = e.target.checked; renderRows(); });
document.querySelectorAll(".markall-btn").forEach(btn => {
  btn.addEventListener("click", () => markAllVisible(+btn.dataset.p));
});
document.getElementById("openAsk").addEventListener("click", () => { renderAskSheet(); document.getElementById("askOverlay").hidden = false; });
document.getElementById("closeAsk").addEventListener("click", () => { document.getElementById("askOverlay").hidden = true; });
document.getElementById("askOverlay").addEventListener("click", e => { if(e.target.id === "askOverlay") e.currentTarget.hidden = true; });
document.getElementById("copyAll").addEventListener("click", () => copyText(buildAskText()));

renderAll();
initDb();
</script>
</body>
</html>
